# Coldline
# File: infra/observability/grafana/datasources/datasources.yml
# Component: Grafana data sources
# Purpose: Connect Grafana to the supplied Prometheus and Jaeger services.
# Interacts With: Prometheus and Jaeger
# Sprint/Task: Sprint 1 — Project 1
# Concepts: Cross-signal diagnostics
# Tools: Grafana

apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
