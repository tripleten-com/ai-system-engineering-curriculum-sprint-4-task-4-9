# Coldline - Task 2.6
# File: alembic.ini
# Component: Migration tool configuration
# Purpose: Point Alembic at the supplied migration environment.
# Interacts With: migrations/env.py, migrations/versions/
# Sprint/Task: Sprint 2 - Project 2 / Task 2.6
# Concepts: Version-controlled schema evolution
# Tools: Alembic

[alembic]
script_location = migrations
# One file name template, so a generated revision is identifiable by reading the
# directory. The revision id itself is generated by Alembic and is what the
# answer sheet records.
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

# The database URL is deliberately absent. `migrations/env.py` reads
# COLDLINE_DATABASE_URL from the environment the container already provides, so
# no connection string is committed to this repository.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
