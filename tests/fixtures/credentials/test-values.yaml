# Coldline - Task 4.3
# File: tests/fixtures/credentials/test-values.yaml
# Component: Credential-absence check values
# Purpose: The credential values this stack holds, listed once so the audit checks can search for them.
# Interacts With: tests/security/interaction.py, tests/contract/test_output_audit.py, the student audit tests
# Sprint/Task: Sprint 4 - Project 4 / Task 4.3
# Concepts: Audit records without credentials, searching for what must be absent
# Tools: YAML

# These are the development credentials this local stack runs with: the worker's provider
# key literal from src/worker/config.py, the LocalStack development access keys and the
# PostgreSQL password from compose.yaml. They are committed in those files already.
# This file lists them in one place so
# the credential-absence checks, and the student's test that loads them through the
# harness, can assert that none of them appears in any audit record. Keep the file as
# supplied.
values:
  model_provider_key: coldline-dev-provider-key-v1
  localstack_access_key_id: localstack-development-key
  localstack_secret_access_key: localstack-development-secret
  postgres_password: coldline_local
