# File: tests/fixtures/tokens/fixtures.yaml
# Component: Token fixtures
# Purpose: Eight development tokens for the exception summary access checks, by fixture name.
# Interacts With: tests/security/fixtures.py, poe token-check, poe auth-checks, the student tests
# Sprint/Task: Sprint 4 - Project 4 / Task 4.2
# Concepts: Bearer tokens, signature, issuer, audience, expiry, role, scope
# Tools: YAML, JWT (RS256)

# These fixed synthetic tokens were signed for the local development issuer and
# committed intentionally. They identify no real person and grant no access outside
# this local development stack. Keep the file as supplied.
#
# One compact JWT per fixture name. `dispatcher-valid` is the one token the protected
# summary read accepts. `gateway-valid`, `wrong-role`, and `missing-scope` are valid tokens
# the access rule refuses (403): a sensor gateway, a role the policy does not grant for
# reading summaries, and a dispatcher without the read scope. `bad-signature`,
# `wrong-issuer`, `wrong-audience`, and `expired` are invalid tokens the verifier refuses
# (401). The valid tokens expire in 2099; `expired` expired in January 2024, far past the
# largest leeway docs/security/access-policy.md allows.
#
# A token's claims are its second dot-separated part, base64url-encoded JSON; decode that
# part (pad it with `==`) to read them. The signature is the third part.
