# Coldline - Task 4.5
# File: .github/workflows/security.yml
# Component: Security gate CI
# Purpose: Run the three pinned scanners over the files at each pull request's head and fail per security/gate.yaml.
# Interacts With: uv, Poe, Docker, security/scanners.yaml, security/gate.yaml, .gitleaks.toml, security/semgrep-rules.yaml
# Sprint/Task: Sprint 4 - Project 4 / Task 4.5
# Concepts: A gate in the pull request path, pinned tools, reports kept as evidence
# Tools: GitHub Actions, Semgrep, Trivy, Gitleaks

# Supplied and not student-editable: what you configure is security/gate.yaml and the one
# allowlist entry in .gitleaks.toml. The job runs `poe security-scan`, the same command you
# run locally, so the thresholds and the suppression you set are what the hosted gate
# applies; it fails only on that command's exit code, which is 1 exactly when an
# unsuppressed finding sits at or above a threshold. Whatever the verdict, the scan report
# (scan.sarif) and the software bill of materials (sbom.cdx.json) are uploaded as the
# `security-reports` artifact of the run, so a failing run keeps its evidence.

name: Security gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # The pull request's own head commit, not the synthetic merge commit a pull_request
      # checkout gives by default: the gate judges the files the student pushed, and the
      # scan report records which commit that was. On workflow_dispatch there is no pull
      # request and the dispatched commit is checked out.
      - name: Check out the pull request head
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record the checked-out commit
        run: |
          checked_out="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ "$checked_out" != "$expected" ]; then
            echo "::error::checked out $checked_out, expected $expected"
            exit 1
          fi
          echo "SCANNED_REVISION=$checked_out" >> "$GITHUB_ENV"
          echo "Scanned commit: $checked_out" >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Python 3.12
        # actions/setup-python v6.0.0
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"
      - name: Install pinned tooling
        run: |
          python infra/scripts/bootstrap.py
          python infra/scripts/preflight.py
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"
          .tools/bin/uv sync --frozen
      # The three scanner images by digest and the vulnerability database at its pinned
      # digest, once, into the ignored cache. Every scan after this step runs offline.
      - name: Prepare the pinned scanners
        run: .tools/bin/uv run --frozen poe security-setup
      # Semgrep (the local rules, metrics off), Trivy (the lockfile, the pinned database,
      # no update) and Gitleaks (the checked-out files, this repository's configuration)
      # over the files at the pull request's head, whose commit the report records. Exit 1
      # only when an unsuppressed finding is at or above a threshold in security/gate.yaml.
      - name: Run the security scan
        run: .tools/bin/uv run --frozen poe security-scan --revision "$SCANNED_REVISION"
      # Kept whatever the verdict: a failing run's report is the evidence the Task asks for.
      - name: Upload the scan report and the software bill of materials
        if: always()
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-reports
          path: reports/security/
          if-no-files-found: warn
          retention-days: 90
